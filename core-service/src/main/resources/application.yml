spring:
  application:
    name: core-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sakurabank}
    username: ${DB_USER:sakura}
    password: ${DB_PASSWORD:sakura_local_dev}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
        format_sql: true

  flyway:
    default-schema: core

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: OFF

jwt:
  secret: ${JWT_SECRET}

kyc:
  transfer-threshold: 100000.00

aml:
  threshold: 1000000.00
  velocity:
    count: 5
    window-minutes: 10
  structuring:
    count: 3
    window-hours: 24
    minimum-amount: 900000.00