spring:
  application:
    name: core-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness + /readiness for deploy checks

# Database wiring lands in Phase 1 together with JPA + Flyway.
# Values will come from env vars only (DB_HOST, DB_USER, DB_PASSWORD via SSM in AWS).
# Zero secrets in this file, ever — see SECURITY.md and gitleaks CI stage.
