name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core-service/**'
              - '.github/workflows/**'
            ai:
              - 'ai-service/**'
              - '.github/workflows/**'

  gitleaks:
    # Runs on every push regardless of paths - secrets can leak anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  core-service:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sakura
          POSTGRES_PASSWORD: sakura_local_dev
          POSTGRES_DB: sakurabank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sakura"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: core-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify runs unit + integration tests against the PostgreSQL
      # service container above, plus the JaCoCo coverage gate.
      - name: Build, test, coverage gate
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: core-service/target/site/jacoco/

  ai-service:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sakura
          POSTGRES_PASSWORD: sakura_local_dev
          POSTGRES_DB: sakurabank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sakura"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Create AI schema
        run: >
          python -c
          "from app.database import engine;
          from sqlalchemy import text;
          with engine.begin() as connection:
              connection.execute(text('CREATE SCHEMA IF NOT EXISTS ai'))"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Ingest FAQ embeddings
        run: python -m app.ingest

      - name: Lint (ruff)
        run: ruff check .

      # pytest addopts in pyproject.toml enforce --cov-fail-under=80
      - name: Tests + coverage gate
        run: pytest

# Phase 4 adds: docker build + Trivy image scan + push + deploy stages.
