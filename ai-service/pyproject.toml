[project]
name = "sakurabank-ai-service"
version = "0.1.0"
description = "SakuraBank Japanese banking RAG chatbot (FastAPI + Claude API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # Phase 3 adds: anthropic, psycopg[binary], pgvector, redis, alembic
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",      # FastAPI TestClient transport
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # errors, pyflakes, isort, bugbear, pyupgrade

[tool.coverage.run]
branch = true
